name: Deploy to GitHub Pages

# Minden main-re érkező változás automatikusan kimegy, és kézzel is indítható.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Egyszerre egy Pages-deploy fusson, de a már futót ne szakítsuk félbe.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pages beállítása
        id: pages
        # A Pages maga egyszer, kézzel lett bekapcsolva (forrás: GitHub
        # Actions). Az `enablement: true` itt NEM működik: a GITHUB_TOKEN nem
        # hozhat létre Pages site-ot ("Resource not accessible by integration").
        uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Statikus export
        env:
          # Amíg a projekt nem kész, élesben CSAK a landing (a kép) menjen ki.
          # Kikapcsolás: töröld ezt a sort és az alábbi "Csak a landing" lépést.
          NEXT_PUBLIC_COMING_SOON: "1"
          # Projekt-oldalnál ez "/q-banya". A next.config.mjs és a
          # lib/basePath.ts ugyanúgy normalizálja (a puszta "/" üresre).
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      # A statikus exportnál a többi útvonal is legenerálódik; élesben most
      # nem akarjuk kitenni őket. A dev/Vercel buildet ez nem érinti.
      - name: Csak a landing maradjon
        run: |
          cd out
          find . -maxdepth 1 -mindepth 1 \
            ! -name 'index.html' \
            ! -name '404.html' \
            ! -name '_next' \
            ! -name '.nojekyll' \
            ! -name 'bazalt-06.jpg' \
            -exec rm -rf {} +
          echo "Kimenet:"; ls -a

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
